<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DataPilot — ask questions about your CSV, Excel and SQL data" />
    <meta name="theme-color" content="#FAFAFA" />
    <title>DataPilot</title>
    <script>
      // Apply the saved theme before first paint (light is the default).
      try {
        if (localStorage.getItem("datapilot-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { /* storage blocked — stay light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
